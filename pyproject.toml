[build-system]
requires = ["setuptools>=65.0", "wheel", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[project]
name = "tope"
version = "0.1.0"
description = "ToPE: Topological Pattern Recognition for Enzymes - Structure-to-function prediction via persistent sheaf Laplacians and topological deep learning"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "Derin Fasipe"}
]
keywords = [
    "computational biology",
    "topological data analysis",
    "enzyme catalysis",
    "persistent homology",
    "graph neural networks",
    "protein structure",
    "bioinformatics",
    "sheaf Laplacian",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Chemistry",
]

dependencies = [
    # Core
    "numpy>=1.24,<2.0",
    "torch>=2.0",
    "torch-geometric>=2.4",
    "torch-scatter>=2.1",
    "torch-sparse>=0.6",

    # Data processing
    "pandas>=2.1",
    "pyarrow>=14.0",
    "requests>=2.31",
    "tqdm>=4.62.0",
    "pyyaml>=6.0",

    # Structure parsing
    "biopython>=1.83",

    # Scientific computing
    "scipy>=1.11",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=23.0",
    "ruff>=0.1",
    "mypy>=1.0",
    "pre-commit>=3.0",
]
sasa = [
    "freesasa>=2.2",
]
tda = [
    # Traditional TDA (optional, largely replaced by TTN)
    "gudhi>=3.9",
    "giotto-tda>=0.6",
]
docs = [
    "sphinx>=5.0",
    "sphinx-rtd-theme>=1.0",
    "nbsphinx>=0.8",
    "myst-parser>=0.18",
]
viz = [
    "matplotlib>=3.5",
    "seaborn>=0.12",
    "plotly>=5.0",
]
all = [
    "tope[dev,sasa,tda,docs,viz]",
]

[project.urls]
Homepage = "https://github.com/ad3rin0la/pattern"
Documentation = "https://github.com/ad3rin0la/pattern#readme"
Repository = "https://github.com/ad3rin0la/pattern"
Issues = "https://github.com/ad3rin0la/pattern/issues"

[project.scripts]
tope-train = "tope.training.cli:main"
tope-curate = "tope.data.cli:curate"
tope-predict = "tope.models.cli:predict"
tope-ingest-topec = "tope.data.cli:ingest_topec"

[tool.setuptools.packages.find]
where = ["."]
include = ["tope*"]

[tool.setuptools.package-data]
tope = [
    "data/voip_tables/*.json",
    "data/ec_hierarchy/*.yaml",
    "*.txt",
    "*.md",
]

[tool.black]
line-length = 100
target-version = ["py39", "py310", "py311"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
    | \.venv
    | build
    | dist
)/
'''

[tool.ruff]
line-length = 100
target-version = "py39"
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]

[tool.ruff.isort]
known-first-party = ["tope"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short --cov=tope --cov-report=term"
