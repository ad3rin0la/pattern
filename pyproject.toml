[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tope"
version = "0.1.0"
description = "ToPE: Topological Pattern Recognition for Enzymes - Deep learning architecture for enzyme function prediction using persistent homology and geometric deep learning"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "ToPE Contributors"}
]
keywords = [
    "enzyme",
    "deep-learning",
    "topological-data-analysis",
    "persistent-homology",
    "graph-neural-networks",
    "protein-structure",
    "bioinformatics",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Chemistry",
]

dependencies = [
    # Core
    "numpy>=1.24,<2.0",
    "torch>=2.0",
    "torch-geometric>=2.4",
    "torch-scatter>=2.1",
    "torch-sparse>=0.6",

    # Data processing
    "pandas>=2.1",
    "pyarrow>=14.0",
    "requests>=2.31",

    # Structure parsing
    "biopython>=1.83",

    # Scientific computing
    "scipy>=1.11",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=23.0",
    "ruff>=0.1",
    "mypy>=1.0",
    "pre-commit>=3.0",
]
sasa = [
    "freesasa>=2.2",
]
tda = [
    # Traditional TDA (optional, replaced by TTN)
    "gudhi>=3.9",
    "giotto-tda>=0.6",
]
all = [
    "tope[dev,sasa,tda]",
]

[project.urls]
Homepage = "https://github.com/ad3rin0la/pattern"
Documentation = "https://github.com/ad3rin0la/pattern#readme"
Repository = "https://github.com/ad3rin0la/pattern"
Issues = "https://github.com/ad3rin0la/pattern/issues"

[project.scripts]
tope-train = "tope_model.trainer:main"
tope-curate = "data_curation.pipeline:main"
tope-ingest-topec = "data_curation.topec_ingestion:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["tope_model*", "data_curation*"]

[tool.setuptools.package-data]
"*" = ["*.txt", "*.md"]

[tool.black]
line-length = 100
target-version = ["py39", "py310", "py311"]
include = '\.pyi?$'
exclude = '''
/(
    \.git
    | \.venv
    | build
    | dist
)/
'''

[tool.ruff]
line-length = 100
target-version = "py39"
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]

[tool.ruff.isort]
known-first-party = ["tope_model", "data_curation"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
